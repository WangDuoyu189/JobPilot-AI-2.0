name: Deploy JobPilot AI to Tencent CloudBase

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Build Next.js
        run: npm run build

      - name: Prepare CloudBase standalone package
        shell: bash
        run: |
          chmod +x scf_bootstrap
          mkdir -p .next/standalone/public
          mkdir -p .next/standalone/.next
          cp -r public/. .next/standalone/public/
          cp -r .next/static .next/standalone/.next/static
          cp scf_bootstrap .next/standalone/scf_bootstrap
          chmod +x .next/standalone/scf_bootstrap

      - name: Install CloudBase CLI V3
        run: npm install -g @cloudbase/cli

      - name: Login to CloudBase
        run: tcb login --apiKeyId "${{ secrets.TCB_SECRET_ID }}" --apiKey "${{ secrets.TCB_SECRET_KEY }}"

      - name: Deploy HTTP function
        run: |
          tcb fn deploy jobpilot-ai-web             --dir .next/standalone             --httpFn             --runtime Nodejs22.21             --install-dependency false             --force             --yes             --path /             -e "${{ secrets.TCB_ENV_ID }}"             --json

      - name: Show function list
        run: tcb fn list -e "${{ secrets.TCB_ENV_ID }}" --json
